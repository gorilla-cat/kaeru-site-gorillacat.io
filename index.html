  <div class="container">
    <div class="header-image">
      <img src="title-gg.png" alt="サイトタイトル画像" />
    </div>

    <div class="filters">
      <form>
        <div class="filter-group">
          <label for="timeFilter">上演時間:</label>
          <select id="timeFilter">
            <option value="">すべて</option>
            <option value="15">~10分</option>
            <option value="30">~30分</option>
            <option value="60">60分</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="maleFilter">男性キャスト:</label>
          <select id="maleFilter">
            <option value="">すべて</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4~</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="femaleFilter">女性キャスト:</label>
          <select id="femaleFilter">
            <option value="">すべて</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4~</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="genreFilter">ジャンル:</label>
          <select id="genreFilter">
            <option value="">すべて</option>
            <option value="青春">青春</option>
            <option value="コメディ">コメディ</option>
            <option value="感動">感動</option>
            <option value="ラブストーリー">ラブストーリー</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="castFilter">上演人数:</label>
          <select id="castFilter">
            <option value="">すべて</option>
            <option value="3">~3人</option>
            <option value="4">4人</option>
            <option value="5">5人</option>
            <option value="6">6人~</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="sortOrder">並べ替え:</label>
          <select id="sortOrder">
            <option value="asc">昇順</option>
            <option value="desc">降順</option>
          </select>
        </div>

        <button type="button" id="searchButton">検索</button>
      </form>
    </div>

    <div id="scriptList"></div>
  </div>

  <script src="scripts.js"></script>

  <script>
    const hamburger = document.getElementById("hamburgerBtn");
    const sidebar = document.getElementById("sidebar");
  
    hamburger.addEventListener("click", () => {
      console.log("クリックされた！");
      sidebar.style.display = sidebar.style.display === "block" ? "none" : "block";
    });
  </script>
